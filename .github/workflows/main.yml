name: Sailfish build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/sailfishos-open/docker-sailfishos-builder-armv7hl:5.1.0.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        run: |
          buildrpm
            -r https://repo.sailfishos.org/obs/sailfishos:/chum:/testing/5.1.0.11_armv7hl/

      - name: Show RPM
        run: |
          find RPMS -type f -name "*.rpm" -print
